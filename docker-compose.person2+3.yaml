# Hybrid: Person 2 (Stream Processing) + Person 3 (ML & MLOps)
# Jalankan semua service Person 2 + Person 3 di 1 laptop.
# Koneksi eksternal (Kafka, Postgres, FastAPI) via Tailscale.
#
# Usage:
#   1. Init Garage untuk dapetin keys:
#      docker compose -f docker-compose.person2+3.yaml up garage-init
#      (catet ACCESS_KEY & SECRET_KEY dari log, isi ke .env)
#
#   2. Jalanin semua service:
#      docker compose -f docker-compose.person2+3.yaml up -d
#
#   3. Cek log:
#      docker compose -f docker-compose.person2+3.yaml logs --tail=20

services:

  # ===== Person 2: Stream Processing =====
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: person2-spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    restart: unless-stopped
    networks:
      - hybrid-net

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: person2-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    restart: unless-stopped
    networks:
      - hybrid-net

  processing-job:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: person2-processing-job
    depends_on:
      - spark-master
      - spark-worker
      - garage
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: gold_stream
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      PROCESSING_INTERVAL: "1"
    restart: unless-stopped
    networks:
      - hybrid-net

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: person2-garage
    hostname: garage
    entrypoint: /garage
    command: server
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
    volumes:
      - garage_data:/mnt/data
      - ./garage.toml:/etc/garage.toml
    restart: unless-stopped
    networks:
      - hybrid-net

  garage-init:
    build:
      context: ./storage/garage
      dockerfile: Dockerfile
    container_name: person2-garage-init
    depends_on:
      - garage
    environment:
      GARAGE_ENDPOINT: http://garage:3900
    restart: "no"
    networks:
      - hybrid-net

  # ===== Person 3: ML & MLOps =====
  prefect:
    image: prefecthq/prefect:3-latest
    container_name: person3-prefect
    hostname: prefect
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      retries: 10
      start_period: 10s
    networks:
      - hybrid-net

  mlflow:
    image: python:3.12-slim
    container_name: person3-mlflow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install -q mlflow boto3
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --default-artifact-root s3://mlflow-artifacts/
    environment:
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: ${GARAGE_ENDPOINT:-http://garage:3900}
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    restart: unless-stopped
    networks:
      - hybrid-net

  ml-training:
    build:
      context: .
      dockerfile: storage/trainer/Dockerfile
    container_name: person3-ml-training
    working_dir: /app
    depends_on:
      garage:
        condition: service_started
      prefect:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-gold_prediction}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_SOURCE: ${DATA_SOURCE:-yfinance}
      PREDICTION_HORIZONS: ${PREDICTION_HORIZONS:-12,24,48,72,168,720}
      YF_PERIOD: ${YF_PERIOD:-730d}
      RETRAIN_COUNT_THRESHOLD: ${RETRAIN_COUNT_THRESHOLD:-2000}
      RETRAIN_PERF_WINDOW: ${RETRAIN_PERF_WINDOW:-100}
      RETRAIN_PERF_FACTOR: ${RETRAIN_PERF_FACTOR:-1.5}
    command:
      - /bin/sh
      - -c
      - |
        prefect work-pool create gold-pool --type process 2>/dev/null || true
        python -m storage.prefect.deploy
        exec prefect worker start --pool gold-pool --type process
    restart: unless-stopped
    networks:
      - hybrid-net

volumes:
  garage_data:
  mlflow_data:

networks:
  hybrid-net:
    driver: bridge
