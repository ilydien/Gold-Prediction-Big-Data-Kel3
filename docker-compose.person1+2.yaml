services:

  # ===== Person 1: Data Ingestion (simulated on Dio's machine) =====
  kafka:
    image: apache/kafka:latest
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://0.0.0.0:9093,PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094
      KAFKA_ADVERTISED_LISTENERS: CONTROLLER://kafka:9093,PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: "gold-cluster-01"
    restart: unless-stopped
    networks:
      - gold-net

  yahoo-fetcher:
    build:
      context: .
      dockerfile: producer/Dockerfile
    container_name: yahoo-fetcher
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: gold_stream
      MIN_INTERVAL: "1"
      MAX_INTERVAL: "5"
      PYTHONUNBUFFERED: "1"
    restart: unless-stopped
    networks:
      - gold-net

  # ===== Person 2: Stream Processing + Garage =====
  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    restart: unless-stopped
    networks:
      - gold-net

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    restart: unless-stopped
    networks:
      - gold-net

  processing-job:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: processing-job
    depends_on:
      - spark-master
      - spark-worker
      - garage
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: gold_stream
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      PROCESSING_INTERVAL: "1"
    restart: unless-stopped
    networks:
      - gold-net

  garage:
    image: dxflrs/garage:v2.3.0
    container_name: garage
    hostname: garage
    entrypoint: /garage
    command: server
    ports:
      - "3900:3900"
      - "3901:3901"
      - "3902:3902"
      - "3903:3903"
    volumes:
      - garage_data:/mnt/data
      - ./garage.toml:/etc/garage.toml
    restart: unless-stopped
    networks:
      - gold-net

  garage-init:
    build:
      context: ./storage/garage
      dockerfile: Dockerfile
    container_name: garage-init
    depends_on:
      - garage
    environment:
      GARAGE_ENDPOINT: http://garage:3900
      GARAGE_HOST: garage
    volumes:
      - ./garage.toml:/etc/garage.toml
      - garage_data:/mnt/data
    restart: "no"
    networks:
      - gold-net

  garage-webui:
    image: khairul169/garage-webui:latest
    container_name: garage-webui
    depends_on:
      - garage
    restart: unless-stopped
    ports:
      - "3909:3909"
    volumes:
      - ./garage.toml:/etc/garage.toml
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"
      AUTH_USER_PASS: 'admin:$2y$10$7o8xlJPWHvdSCDXVefF5M.zUPoKI/C0l6meAwvOvdRxnRy.m5E/pC'
    networks:
      - gold-net

volumes:
  garage_data:

networks:
  gold-net:
    driver: bridge
