services:

  prefect:
    image: prefecthq/prefect:3-latest
    container_name: person3-prefect
    hostname: prefect
    command: prefect server start --host 0.0.0.0
    environment:
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
    ports:
      - "4200:4200"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:4200/api/health')"]
      interval: 5s
      retries: 10
      start_period: 10s
    networks:
      - person3-net

  mlflow:
    image: python:3.12-slim
    container_name: person3-mlflow
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        pip install -q mlflow boto3
        mlflow server \
          --host 0.0.0.0 \
          --port 5000 \
          --allowed-hosts '*' \
          --backend-store-uri sqlite:////mlflow/mlflow.db \
          --default-artifact-root s3://mlflow-artifacts/
    environment:
      AWS_ACCESS_KEY_ID: ${GARAGE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_SECRET_KEY}
      MLFLOW_S3_ENDPOINT_URL: http://${GARAGE_HOST:-100.69.198.116}:3900
      MLFLOW_S3_IGNORE_TLS: "true"
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow
    restart: unless-stopped
    networks:
      - person3-net

  ml-training:
    build:
      context: .
      dockerfile: storage/trainer/Dockerfile
    container_name: person3-ml-training
    working_dir: /app
    depends_on:
      prefect:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect:4200/api
      GARAGE_ENDPOINT: http://${GARAGE_HOST:-100.69.198.116}:3900
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DATA_SOURCE: ${DATA_SOURCE:-yfinance}
      PREDICTION_HORIZONS: ${PREDICTION_HORIZONS:-1,12,24,48,72}
      YF_PERIOD: ${YF_PERIOD:-730d}
      RETRAIN_COUNT_THRESHOLD: ${RETRAIN_COUNT_THRESHOLD:-2000}
      RETRAIN_PERF_WINDOW: ${RETRAIN_PERF_WINDOW:-100}
      RETRAIN_PERF_FACTOR: ${RETRAIN_PERF_FACTOR:-1.5}
    command:
      - /bin/sh
      - -c
      - |
        prefect work-pool create gold-pool --type process 2>/dev/null || true
        python -m storage.prefect.deploy
        exec prefect worker start --pool gold-pool --type process
    restart: unless-stopped
    networks:
      - person3-net

networks:
  person3-net:
    driver: bridge

volumes:
  mlflow-data:
