services:

  spark-master:
    image: bitnamilegacy/spark:3.5
    container_name: person2-spark-master
    hostname: spark-master
    environment:
      - SPARK_MODE=master
      - SPARK_RPC_AUTHENTICATION_ENABLED=no
      - SPARK_RPC_ENCRYPTION_ENABLED=no
      - SPARK_LOCAL_STORAGE_ENCRYPTION_ENABLED=no
      - SPARK_SSL_ENABLED=no
    ports:
      - "7077:7077"
      - "8080:8080"
    restart: unless-stopped
    networks:
      - person2-net

  spark-worker:
    image: bitnamilegacy/spark:3.5
    container_name: person2-spark-worker
    depends_on:
      - spark-master
    environment:
      - SPARK_MODE=worker
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2G
      - SPARK_WORKER_CORES=2
    restart: unless-stopped
    networks:
      - person2-net

  processing-job:
    build:
      context: .
      dockerfile: spark/Dockerfile
    container_name: person2-processing-job
    depends_on:
      - spark-master
      - spark-worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      KAFKA_TOPIC: gold_stream
      GARAGE_ENDPOINT: ${GARAGE_ENDPOINT}
      GARAGE_ACCESS_KEY: ${GARAGE_ACCESS_KEY}
      GARAGE_SECRET_KEY: ${GARAGE_SECRET_KEY}
      FASTAPI_URL: ${FASTAPI_URL}
      PROCESSING_INTERVAL: "10"
    restart: unless-stopped
    networks:
      - person2-net

networks:
  person2-net:
    driver: bridge
